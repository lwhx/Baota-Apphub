services:
  kejilion-antigravity:
    image: lbjlaq/antigravity-manager:latest
    container_name: ${APP_NAME}
    restart: unless-stopped
    networks:
      - baota_net
    ports:
      - "${BIND_IP}:${WEB_PORT}:8045"
    volumes:
      - "${APP_PATH}/data/data:/root/.antigravity_tools"
    environment:
      - "ABV_MAX_BODY_SIZE=104857600"
      - "TZ=Asia/Shanghai"
      - "API_KEY=${API_KEY:?Please set API_KEY}"
      - "WEB_PASSWORD=${WEB_PASSWORD:?Please set WEB_PASSWORD}"
    deploy:
      resources:
        limits:
          cpus: ${CPUS}
          memory: ${MEMORY_LIMIT}
    labels:
      createdBy: bt_apps
      source: kejilion-apps

networks:
  baota_net:
    external: true
