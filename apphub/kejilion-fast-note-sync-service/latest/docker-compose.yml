services:
  kejilion-fast-note-sync-service:
    image: haierkeys/fast-note-sync-service:latest
    container_name: ${APP_NAME}
    restart: unless-stopped
    networks:
      - baota_net
    ports:
      - "${BIND_IP}:${WEB_PORT}:9000"
    volumes:
      - "${APP_PATH}/data/storage:/fast-note-sync/storage"
      - "${APP_PATH}/data/config:/fast-note-sync/config"
    environment:
      - "TZ=Asia/Shanghai"
    deploy:
      resources:
        limits:
          cpus: ${CPUS}
          memory: ${MEMORY_LIMIT}
    labels:
      createdBy: bt_apps
      source: kejilion-apps

networks:
  baota_net:
    external: true
