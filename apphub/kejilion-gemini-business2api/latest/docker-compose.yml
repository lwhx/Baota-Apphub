services:
  kejilion-gemini-business2api:
    image: cooooookk/gemini-business2api:latest
    container_name: ${APP_NAME}
    restart: unless-stopped
    networks:
      - baota_net
    ports:
      - "${BIND_IP}:${WEB_PORT}:7860"
    volumes:
      - "${APP_PATH}/data/data:/app/data"
    environment:
      - "TZ=Asia/Shanghai"
      - "ADMIN_KEY=${ADMIN_KEY:?Please set ADMIN_KEY}"
      - "API_KEY=${API_KEY:?Please set API_KEY}"
    deploy:
      resources:
        limits:
          cpus: ${CPUS}
          memory: ${MEMORY_LIMIT}
    labels:
      createdBy: bt_apps
      source: kejilion-apps

networks:
  baota_net:
    external: true
