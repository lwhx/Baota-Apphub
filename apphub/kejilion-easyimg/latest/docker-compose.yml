services:
  kejilion-easyimg:
    image: ghcr.io/chaos-zhu/easyimg:latest
    container_name: ${APP_NAME}
    restart: unless-stopped
    networks:
      - baota_net
    ports:
      - "${BIND_IP}:${WEB_PORT}:3000"
    volumes:
      - "${APP_PATH}/data/db:/app/db"
      - "${APP_PATH}/data/uploads:/app/uploads"
    environment:
      - "NODE_ENV=production"
      - "HOST=0.0.0.0"
      - "PORT=3000"
      - "TZ=Asia/Shanghai"
    deploy:
      resources:
        limits:
          cpus: ${CPUS}
          memory: ${MEMORY_LIMIT}
    labels:
      createdBy: bt_apps
      source: kejilion-apps

networks:
  baota_net:
    external: true
