services:
  kejilion-aistudio-to-api:
    image: ibuhub/aistudio-to-api:latest
    container_name: ${APP_NAME}
    restart: unless-stopped
    networks:
      - baota_net
    ports:
      - "${BIND_IP}:${WEB_PORT}:7860"
    volumes:
      - "${APP_PATH}/data/auth:/app/configs/auth"
      - "${APP_PATH}/data/data:/app/data"
    environment:
      - "TZ=Asia/Shanghai"
      - "API_KEYS=${API_KEYS:?Please set API_KEYS}"
      - "WEB_CONSOLE_PASSWORD=${WEB_CONSOLE_PASSWORD:?Please set WEB_CONSOLE_PASSWORD}"
    deploy:
      resources:
        limits:
          cpus: ${CPUS}
          memory: ${MEMORY_LIMIT}
    labels:
      createdBy: bt_apps
      source: kejilion-apps

networks:
  baota_net:
    external: true
