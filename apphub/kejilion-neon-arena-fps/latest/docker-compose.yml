services:
  kejilion-neon-arena-fps:
    image: kjlion/neon-arena-fps:latest
    container_name: ${APP_NAME}
    restart: unless-stopped
    networks:
      - baota_net
    ports:
      - "${BIND_IP}:${WEB_PORT}:3000"
    volumes:
      - "${APP_PATH}/data/data:/app/data"
    environment:
      - "PORT=3000"
      - "TZ=Asia/Shanghai"
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: ${CPUS}
          memory: ${MEMORY_LIMIT}
    labels:
      createdBy: bt_apps
      source: kejilion-apps

networks:
  baota_net:
    external: true
