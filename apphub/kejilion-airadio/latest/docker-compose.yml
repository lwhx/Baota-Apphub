services:
  kejilion-airadio:
    image: superneed/airadio:latest
    container_name: ${APP_NAME}
    restart: unless-stopped
    networks:
      - baota_net
    ports:
      - "${BIND_IP}:${WEB_PORT}:4177"
    volumes:
      - "${APP_PATH}/data/data:/data"
    environment:
      - "NODE_ENV=production"
      - "TZ=Asia/Shanghai"
      - "AIRADIO_API_HOST=0.0.0.0"
      - "AIRADIO_API_PORT=4177"
      - "AIRADIO_STORAGE_DIR=/data"
      - "AIRADIO_ADMIN_USER=admin"
      - "AIRADIO_ADMIN_PASSWORD=${AIRADIO_ADMIN_PASSWORD:?Please set AIRADIO_ADMIN_PASSWORD}"
    deploy:
      resources:
        limits:
          cpus: ${CPUS}
          memory: ${MEMORY_LIMIT}
    labels:
      createdBy: bt_apps
      source: kejilion-apps

networks:
  baota_net:
    external: true
