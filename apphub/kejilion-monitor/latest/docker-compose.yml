services:
  kejilion-monitor:
    image: stqfdyr/monitor:latest
    container_name: ${APP_NAME}
    restart: unless-stopped
    networks:
      - baota_net
    ports:
      - "${BIND_IP}:${WEB_PORT}:28080"
    volumes:
      - "${APP_PATH}/data/data:/data"
    environment:
      - "TZ=Asia/Shanghai"
    deploy:
      resources:
        limits:
          cpus: ${CPUS}
          memory: ${MEMORY_LIMIT}
    labels:
      createdBy: bt_apps
      source: kejilion-apps

networks:
  baota_net:
    external: true
