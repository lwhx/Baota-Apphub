services:
  vertex:
    container_name: ${APP_NAME}
    restart: always
    networks:
      - baota_net
    ports:
      - "${WEB_PORT}:${WEB_PORT}"  # 添加引号避免解析问题
    volumes:
      - ${APP_PATH}/data:/vertex
    environment:
      - TZ=Asia/Shanghai
      - PORT=${WEB_PORT}
    image: lswl/vertex:latest
    deploy:
      resources:
        limits:
          cpus: "${CPUS}"  # 添加引号
          memory: "${MEMORY_LIMIT}"  # 添加引号
    labels:
      createdBy: "bt_apps"
      # 可选：添加更多标签便于管理
      app.name: "vertex"
      app.version: "latest"

networks:
  baota_net:
    external: true
    name: baota_net  # 明确指定网络名称
