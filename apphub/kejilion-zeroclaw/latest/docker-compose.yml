services:
  kejilion-zeroclaw:
    image: ghcr.io/zeroclaw-labs/zeroclaw:latest
    container_name: ${APP_NAME}
    restart: unless-stopped
    networks:
      - baota_net
    ports:
      - "${BIND_IP}:${WEB_PORT}:42617"
    volumes:
      - "${APP_PATH}/data/data:/zeroclaw-data"
    environment:
      - "ZEROCLAW_ALLOW_PUBLIC_BIND=true"
      - "ZEROCLAW_GATEWAY_PORT=42617"
      - "TZ=Asia/Shanghai"
      - "API_KEY=${API_KEY:?Please set API_KEY}"
      - "PROVIDER=${PROVIDER}"
    healthcheck:
      test: ["CMD-SHELL","zeroclaw status"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: ${CPUS}
          memory: ${MEMORY_LIMIT}
    labels:
      createdBy: bt_apps
      source: kejilion-apps

networks:
  baota_net:
    external: true
