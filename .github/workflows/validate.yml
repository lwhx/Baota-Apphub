name: Validate application catalog
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install YAML validator
        run: python -m pip install 'PyYAML>=6.0,<7'
      - name: Check application metadata and Compose templates
        run: python scripts/validate_catalog.py

      - name: Validate critical Docker Compose models
        shell: bash
        run: |
          set -euo pipefail
          for config in \
            apphub/nginx-proxy-manager/latest/docker-compose.yml \
            apphub/mysql/8.4.3/docker-compose.yml \
            apphub/immich/1.122.3/docker-compose.yml \
            apphub/bitwarden/latest/docker-compose.yml \
            apphub/pterodactyl-china/latest/docker-compose.yml \
            apphub/vanblog/latest/docker-compose.yml; do
              echo "Checking $config"
              docker compose -f "$config" config --no-interpolate --no-env-resolution --no-path-resolution --quiet
          done

      - name: Full native Compose syntax audit
        shell: bash
        run: |
          set -euo pipefail
          total=0
          failures=0
          while IFS= read -r -d '' file; do
            total=$((total + 1))
            if ! output=$(docker compose -f "$file" config --no-interpolate --no-env-resolution --no-path-resolution --quiet 2>&1); then
              printf "FAILED: %s\n" "$file"
              echo "::error file=$file::Compose model validation failed"
              printf '%s\n' "$output"
              failures=$((failures + 1))
            fi
          done < <(find apphub -type f -name docker-compose.yml -print0)
          printf 'Validated %s Compose files: %s failures\n' "$total" "$failures"
          test "$total" -gt 0 && test "$failures" -eq 0
