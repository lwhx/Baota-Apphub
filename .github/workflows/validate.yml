name: Validate application catalog
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  userscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Validate generated script and category behavior
        run: npm test
      - name: Install browser for UI compatibility tests
        run: npx playwright install --with-deps chromium
      - name: Verify native navigation, filtering, installation data and custom groups
        run: npm run test:browser
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install YAML validator
        run: python -m pip install 'PyYAML>=6.0,<7'
      - name: Check application metadata and Compose templates
        run: python scripts/validate_catalog.py

      - name: Validate critical Docker Compose models
        shell: bash
        run: |
          set -euo pipefail
          for config in \
            apphub/nginx-proxy-manager/latest/docker-compose.yml \
            apphub/mysql/8.4.3/docker-compose.yml \
            apphub/immich/1.122.3/docker-compose.yml \
            apphub/bitwarden/latest/docker-compose.yml \
            apphub/pterodactyl-china/latest/docker-compose.yml \
            apphub/vanblog/latest/docker-compose.yml; do
              echo "Checking $config"
              docker compose -f "$config" config --no-interpolate --no-env-resolution --no-path-resolution --quiet
          done

      - name: Full native Compose syntax audit
        shell: bash
        run: |
          set -euo pipefail
          total=0
          failures=0
          while IFS= read -r -d '' file; do
            total=$((total + 1))
            if ! output=$(docker compose -f "$file" config --no-interpolate --no-env-resolution --no-path-resolution --quiet 2>&1); then
              printf "FAILED: %s\n" "$file"
              echo "::error file=$file::Compose model validation failed"
              printf '%s\n' "$output"
              failures=$((failures + 1))
            fi
          done < <(find apphub -type f -name docker-compose.yml -print0)
          printf 'Validated %s Compose files: %s failures\n' "$total" "$failures"
          test "$total" -gt 0 && test "$failures" -eq 0

      - name: Validate kejilion source labels, unique ports and required secrets
        run: python scripts/validate_kejilion.py
      - name: Native Compose expansion test for imported apps
        shell: bash
        run: |
          set -euo pipefail
          export APP_NAME=test-kejilion APP_PATH=/tmp/test-kejilion CPUS=1 MEMORY_LIMIT=512M HOST_IP=127.0.0.1
          export AIRADIO_ADMIN_PASSWORD=ci-test-password API_KEYS=ci-test-key WEB_CONSOLE_PASSWORD=ci-test-password
          export API_KEY=ci-test-key WEB_PASSWORD=ci-test-password ADMIN_KEY=ci-test-admin-key
          export POSTGRES_PASSWORD=ci-test-hex-password ADMIN_EMAIL=admin@example.test ADMIN_PASSWORD=ci-test-password
          export JWT_SECRET=ci-test-signing-key TOTP_ENCRYPTION_KEY=ci-test-totp-key
          total=0
          for file in apphub/kejilion-*/latest/docker-compose.yml; do
            total=$((total + 1))
            docker compose --env-file "$(dirname "$file")/.env" -f "$file" config --quiet
          done
          printf 'Imported Compose runtime expansion: %s successful\n' "$total"
